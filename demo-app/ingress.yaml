kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: web-svc
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://linkerd-gateway.emojivoto:8084/token
spec:
  ingressClassName: nginx
  rules:
    - host: emojivoto.local.gd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  name: http
