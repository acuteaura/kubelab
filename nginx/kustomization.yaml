apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    releaseName: ingress-nginx
    namespace: kube-system
    valuesFile: values.yaml
    additionalValuesFiles:
      - values-kind.yaml
    includeCRDs: true
